stages:
  - test
  - build
  - deploy
  - verify

variables:
  DOCKER_BUILDKIT: "1"
  IMAGE_NAME: "mini-hermes"

contract_test:
  stage: test
  image: python:3.11-slim
  tags:
    - local
  script:
    - pip install --no-cache-dir pytest pyyaml
    - pytest packages/backend/tests/test_ci_pipeline_contract.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"

build_image:
  stage: build
  image: docker:cli
  tags:
    - local
  script:
    - docker build -t ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} -f Dockerfile .
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"

deploy_dev:
  stage: deploy
  image: docker:cli
  tags:
    - local
  script:
    - chmod +x scripts/deploy_and_verify.sh
    - sh ./scripts/deploy_and_verify.sh dev ${CI_COMMIT_SHORT_SHA} /home/vietnh/apps/mini-hermes/envs/backend.dev.env
  environment:
    name: development
    url: https://dev-mini-hermes.ducnq.io.vn
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

deploy_prod:
  stage: deploy
  image: docker:cli
  tags:
    - local
  script:
    - chmod +x scripts/deploy_and_verify.sh
    - sh ./scripts/deploy_and_verify.sh prod ${CI_COMMIT_SHORT_SHA} /home/vietnh/apps/mini-hermes/envs/backend.prod.env
  environment:
    name: production
    url: https://mini-hermes.ducnq.io.vn
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

verify_dev_health:
  stage: verify
  image: alpine:latest
  tags:
    - local
  script:
    - apk add --no-cache curl
    - echo "[+] Checking dev health endpoint..."
    - curl -f -s http://mini-hermes-dev-app:8080/health | grep -q "true"
    - echo "[+] Dev healthcheck PASSED!"
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

verify_prod_health:
  stage: verify
  image: alpine:latest
  tags:
    - local
  script:
    - apk add --no-cache curl
    - echo "[+] Checking prod health endpoint..."
    - curl -f -s http://mini-hermes-prod-app:8080/health | grep -q "true"
    - echo "[+] Prod healthcheck PASSED!"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
