name: ${COMPOSE_PROJECT_NAME:-weai}

x-app-env: &app-env
  AGENT_RUNTIME_ENVIRONMENT_ID: ${AGENT_RUNTIME_ENVIRONMENT_ID:-development}
  DATABASE_URL: postgresql://weai:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/weai
  REDIS_URL: redis://redis:6379/0
  STORAGE_PROVIDER: s3
  S3_ENDPOINT_URL: http://seaweedfs:8333
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-agent-runtime}
  S3_ACCESS_KEY_ID: admin
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
  S3_ADDRESSING_STYLE: path
  WEAI_SECRET_KEY: ${WEAI_SECRET_KEY:?Set WEAI_SECRET_KEY in .env}
  AGENT_RUNTIME_TOKEN_ENCRYPTION_KEY: ${AGENT_RUNTIME_TOKEN_ENCRYPTION_KEY:?Set AGENT_RUNTIME_TOKEN_ENCRYPTION_KEY in .env}
  AGENT_RUNTIME_CONNECTOR_SECRET: ${AGENT_RUNTIME_CONNECTOR_SECRET:?Set AGENT_RUNTIME_CONNECTOR_SECRET in .env}
  AGENT_RUNTIME_CONNECTOR_URL: http://google-connector:8090
  AGENT_RUNTIME_SANDBOX_URL: http://sandbox:8765
  AGENT_RUNTIME_SANDBOX_TOKEN: ${AGENT_RUNTIME_SANDBOX_TOKEN:?Set AGENT_RUNTIME_SANDBOX_TOKEN in .env}
  OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.1min.ai/openai/v1}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  AGENT_RUNTIME_SMALL_TASK_MODEL: ${AGENT_RUNTIME_SMALL_TASK_MODEL:-gpt-4.1-mini}
  AGENT_RUNTIME_GOOGLE_CLIENT_ID: ${AGENT_RUNTIME_GOOGLE_CLIENT_ID:-}
  AGENT_RUNTIME_GOOGLE_CLIENT_SECRET: ${AGENT_RUNTIME_GOOGLE_CLIENT_SECRET:-}
  AGENT_RUNTIME_GOOGLE_REDIRECT_URI: ${AGENT_RUNTIME_GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/agent-runtime/drive/callback}
  FRONTEND_BUILD_DIR: /app/packages/backend/weai/frontend
  ENABLE_VERSION_UPDATE_CHECK: 'false'
  USE_SLIM_DOCKER: 'true'
  ANONYMIZED_TELEMETRY: 'false'

services:
  app:
    build:
      context: .
      args:
        WEAI_RELEASE_VERSION: ${WEAI_RELEASE_VERSION:-dev}
    image: ${IMAGE_NAME:-weai}:${IMAGE_TAG:-local}
    container_name: ${COMPOSE_PROJECT_NAME:-weai}-app
    restart: unless-stopped
    environment:
      <<: *app-env
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.1min.ai/openai/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-http://127.0.0.1:5173;http://localhost:5173}
    volumes:
      - app-data:/app/data
    networks:
      - default
      - sandbox
      - proxy-nw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      seaweedfs:
        condition: service_started
      google-connector:
        condition: service_started
      sandbox:
        condition: service_started

  worker:
    image: ${IMAGE_NAME:-weai}:${IMAGE_TAG:-local}
    container_name: ${COMPOSE_PROJECT_NAME:-weai}-worker
    restart: unless-stopped
    command: ["python", "-m", "weai.documents.worker"]
    environment: *app-env
    volumes:
      - app-data:/app/data
    networks:
      - default
      - sandbox
    depends_on:
      app:
        condition: service_healthy

  sandbox:
    extends:
      file: compose.sandbox.yaml
      service: sandbox
    container_name: ${COMPOSE_PROJECT_NAME:-weai}-sandbox
    restart: unless-stopped
    networks:
      - sandbox

  google-connector:
    image: ${IMAGE_NAME:-weai}:${IMAGE_TAG:-local}
    container_name: ${COMPOSE_PROJECT_NAME:-weai}-google-connector
    restart: unless-stopped
    command: ["uvicorn", "weai.documents.drive:app", "--host", "0.0.0.0", "--port", "8090"]
    environment: *app-env
    expose:
      - '8090'
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.6
    container_name: ${COMPOSE_PROJECT_NAME:-weai}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: weai
      POSTGRES_USER: weai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weai"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default

  redis:
    image: redis:7.4.6-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-weai}-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - default

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    container_name: ${COMPOSE_PROJECT_NAME:-weai}-seaweedfs
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      S3_BUCKET: ${S3_BUCKET_NAME:-agent-runtime}
    volumes:
      - seaweedfs-data:/data
    networks:
      - default
      - proxy-nw

volumes:
  app-data:
  postgres-data:
  redis-data:
  seaweedfs-data:

networks:
  default:
  sandbox:
    internal: true
  proxy-nw:
    external: true
