name: mini-hermes

x-app-env: &app-env
  DATABASE_URL: postgresql://minihermes:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/minihermes
  REDIS_URL: redis://redis:6379/0
  STORAGE_PROVIDER: s3
  S3_ENDPOINT_URL: http://seaweedfs:8333
  S3_BUCKET_NAME: mini-hermes
  S3_ACCESS_KEY_ID: admin
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
  S3_ADDRESSING_STYLE: path
  WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}
  MH_TOKEN_ENCRYPTION_KEY: ${MH_TOKEN_ENCRYPTION_KEY:?Set MH_TOKEN_ENCRYPTION_KEY in .env}
  MH_CONNECTOR_SECRET: ${MH_CONNECTOR_SECRET:?Set MH_CONNECTOR_SECRET in .env}
  MH_CONNECTOR_URL: http://google-connector:8090
  MH_GOOGLE_CLIENT_ID: ${MH_GOOGLE_CLIENT_ID:-}
  MH_GOOGLE_CLIENT_SECRET: ${MH_GOOGLE_CLIENT_SECRET:-}
  MH_GOOGLE_REDIRECT_URI: ${MH_GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/mini-hermes/drive/callback}
  FRONTEND_BUILD_DIR: /app/packages/backend/open_webui/frontend
  ENABLE_VERSION_UPDATE_CHECK: 'false'
  USE_SLIM_DOCKER: 'true'
  ANONYMIZED_TELEMETRY: 'false'

services:
  app:
    build: .
    image: mini-hermes:local
    ports:
      - '127.0.0.1:8080:8080'
    environment: *app-env
    volumes:
      - app-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      seaweedfs:
        condition: service_started
      google-connector:
        condition: service_started

  worker:
    image: mini-hermes:local
    command: ["python", "-m", "open_webui.mini_hermes.worker"]
    environment: *app-env
    volumes:
      - app-data:/app/data
    depends_on:
      app:
        condition: service_started

  google-connector:
    image: mini-hermes:local
    command: ["uvicorn", "open_webui.mini_hermes.drive:app", "--host", "0.0.0.0", "--port", "8090"]
    environment: *app-env
    expose:
      - '8090'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: minihermes
      POSTGRES_USER: minihermes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minihermes"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.6-alpine
    volumes:
      - redis-data:/data

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      S3_BUCKET: mini-hermes
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - seaweedfs-data:/data

volumes:
  app-data:
  postgres-data:
  redis-data:
  seaweedfs-data:
