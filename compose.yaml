name: ${COMPOSE_PROJECT_NAME:-mini-hermes}

x-app-env: &app-env
  DATABASE_URL: postgresql://minihermes:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/minihermes
  REDIS_URL: redis://redis:6379/0
  STORAGE_PROVIDER: s3
  S3_ENDPOINT_URL: http://seaweedfs:8333
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-mini-hermes}
  S3_ACCESS_KEY_ID: admin
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
  S3_ADDRESSING_STYLE: path
  WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}
  MH_TOKEN_ENCRYPTION_KEY: ${MH_TOKEN_ENCRYPTION_KEY:?Set MH_TOKEN_ENCRYPTION_KEY in .env}
  MH_CONNECTOR_SECRET: ${MH_CONNECTOR_SECRET:?Set MH_CONNECTOR_SECRET in .env}
  MH_CONNECTOR_URL: http://google-connector:8090
  MH_SANDBOX_URL: http://sandbox:8765
  MH_SANDBOX_TOKEN: ${MH_SANDBOX_TOKEN:?Set MH_SANDBOX_TOKEN in .env}
  OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.1min.ai/openai/v1}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  MH_SMALL_TASK_MODEL: ${MH_SMALL_TASK_MODEL:-gpt-4.1-mini}
  MH_GOOGLE_CLIENT_ID: ${MH_GOOGLE_CLIENT_ID:-}
  MH_GOOGLE_CLIENT_SECRET: ${MH_GOOGLE_CLIENT_SECRET:-}
  MH_GOOGLE_REDIRECT_URI: ${MH_GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/mini-hermes/drive/callback}
  FRONTEND_BUILD_DIR: /app/packages/backend/open_webui/frontend
  ENABLE_VERSION_UPDATE_CHECK: 'false'
  USE_SLIM_DOCKER: 'true'
  ANONYMIZED_TELEMETRY: 'false'

services:
  app:
    image: ${IMAGE_NAME:-mini-hermes}:${IMAGE_TAG:-local}
    container_name: ${COMPOSE_PROJECT_NAME:-mini-hermes}-app
    restart: unless-stopped
    environment:
      <<: *app-env
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.1min.ai/openai/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-http://127.0.0.1:5173}
    volumes:
      - app-data:/app/data
    networks:
      - default
      - sandbox
      - proxy-nw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      seaweedfs:
        condition: service_started
      google-connector:
        condition: service_started
      sandbox:
        condition: service_started

  worker:
    image: ${IMAGE_NAME:-mini-hermes}:${IMAGE_TAG:-local}
    container_name: ${COMPOSE_PROJECT_NAME:-mini-hermes}-worker
    restart: unless-stopped
    command: ["python", "-m", "open_webui.mini_hermes.worker"]
    environment: *app-env
    volumes:
      - app-data:/app/data
    networks:
      - default
      - sandbox
    depends_on:
      app:
        condition: service_healthy

  sandbox:
    image: ${IMAGE_NAME:-mini-hermes}:${IMAGE_TAG:-local}
    container_name: ${COMPOSE_PROJECT_NAME:-mini-hermes}-sandbox
    restart: unless-stopped
    command: ["python", "-m", "open_webui.mini_hermes.sandbox_service"]
    environment:
      MH_SANDBOX_HOST: 0.0.0.0
      MH_SANDBOX_PORT: '8765'
      MH_SANDBOX_TOKEN: ${MH_SANDBOX_TOKEN:?Set MH_SANDBOX_TOKEN in .env}
      PYTHONDONTWRITEBYTECODE: '1'
      HOME: /tmp
    expose:
      - '8765'
    networks:
      - sandbox
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0

  google-connector:
    image: ${IMAGE_NAME:-mini-hermes}:${IMAGE_TAG:-local}
    container_name: ${COMPOSE_PROJECT_NAME:-mini-hermes}-google-connector
    restart: unless-stopped
    command: ["uvicorn", "open_webui.mini_hermes.drive:app", "--host", "0.0.0.0", "--port", "8090"]
    environment: *app-env
    expose:
      - '8090'
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.6
    container_name: ${COMPOSE_PROJECT_NAME:-mini-hermes}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: minihermes
      POSTGRES_USER: minihermes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minihermes"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default

  redis:
    image: redis:7.4.6-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-mini-hermes}-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - default

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    container_name: ${COMPOSE_PROJECT_NAME:-mini-hermes}-seaweedfs
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      S3_BUCKET: ${S3_BUCKET_NAME:-mini-hermes}
    volumes:
      - seaweedfs-data:/data
    networks:
      - default
      - proxy-nw

volumes:
  app-data:
  postgres-data:
  redis-data:
  seaweedfs-data:

networks:
  default:
  sandbox:
    internal: true
  proxy-nw:
    external: true
