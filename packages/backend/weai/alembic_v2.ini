# Agent Runtime V2 Alembic Configuration
# Greenfield persistence migration environment for 49 ar_* tables

[alembic]
script_location = %(here)s/migrations_v2
prepend_sys_path = .
version_locations = %(here)s/migrations_v2/versions
version_table = alembic_version
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
