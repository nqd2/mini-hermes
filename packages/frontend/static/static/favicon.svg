<svg width="450" height="240" viewBox="0 0 420 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!--
      Dùng gradientTransform="rotate(45, 0.5, 0.5)" hoặc x1="0%" y1="0%" x2="100%" y2="100%"
      Để góc nghiêng đạt chuẩn hình học 45 độ thực tế, ta kết hợp userSpaceOnUse hoặc vector chéo:
    -->

    <!--Gradient Xanh 1: #0b2537 -> #0096ff (nghiêng 45 độ từ trên-trái xuống dưới-phải) -->
    <linearGradient id="blueGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2537" />
      <stop offset="100%" stop-color="#0096ff" />
    </linearGradient>

    <!--Gradient Xanh 2: Ngược lại với hình bình hành 1 (#0096ff -> #0b2537 theo cùng trục 45 độ) -->
    <linearGradient id="blueGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0096ff" />
      <stop offset="100%" stop-color="#0b2537" />
    </linearGradient>

    <!--Gradient Gold: #854d0e -> #e7bb7c (cùng nghiêng 45 độ) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#e7bb7c" />
    </linearGradient>
  </defs>

  <g transform="translate(20, 20)">
    <!--1. Hình bình hành xanh 1 -->
    <polygon points="0,0 50,0 132.84,200 82.84,200" fill="url(#blueGrad1)" />

    <!--2. Hình bình hành xanh 2 (Ngược chiều màu với hình 1) -->
    <polygon points="82.84,0 132.84,0 215.69,200 165.69,200" fill="url(#blueGrad2)" />

    <!--3. Khối Gold bên phải -->
    <polygon points="248.53,0 298.53,0 381.37,200 331.37,200 273.53,60.36 232.11,160.36 207.11,100" fill="url(#goldGrad)" />
  </g>
</svg>